<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tennis Club - Ranking & Matches</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- App Icon -->
  <link rel="icon" type="image/png" href="IMG_20260917_160556.png">
  <link rel="apple-touch-icon" href="IMG_20260917_160556.png">
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center p-4">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>🎾</span> Tennis Club
      </h1>
      <div id="user-header">
        <!-- Filled via JS -->
      </div>
    </div>
  </header>

  <!-- Tab Navigation -->
  <nav class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-10">
    <div class="max-w-4xl mx-auto flex justify-around">
      <button onclick="switchTab('players')" id="tab-players" class="py-3 px-4 text-center font-medium border-b-2 border-indigo-600 text-indigo-600 w-1/3">
        Players
      </button>
      <button onclick="switchTab('ready')" id="tab-ready" class="py-3 px-4 text-center font-medium border-b-2 border-transparent text-slate-500 hover:text-indigo-600 w-1/3">
        Ready to Play
      </button>
      <button onclick="switchTab('matches')" id="tab-matches" class="py-3 px-4 text-center font-medium border-b-2 border-transparent text-slate-500 hover:text-indigo-600 w-1/3">
        Match History
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto w-full p-4 flex-grow">

    <!-- Players Tab -->
    <section id="content-players" class="space-y-4">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-bold text-slate-700">Leaderboard</h2>
        <button id="add-match-btn" onclick="openMatchModal()" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow transition">
          + Record Match
        </button>
      </div>
      <div id="players-list" class="space-y-2">
        <p class="text-slate-400 text-center py-8">Loading player rankings...</p>
      </div>
    </section>

    <!-- Ready to Play Tab -->
    <section id="content-ready" class="space-y-4 hidden">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h2 class="text-lg font-bold text-slate-700 mb-2">My Status</h2>
        <div id="status-toggle-container">
          <p class="text-slate-500 text-sm mb-3">Log in to update your readiness status on court.</p>
        </div>
      </div>

      <h2 class="text-lg font-bold text-slate-700 mt-6 mb-2">Available Players</h2>
      <div id="ready-players-list" class="space-y-2">
        <p class="text-slate-400 text-center py-8">Checking for available players...</p>
      </div>
    </section>

    <!-- Matches Tab -->
    <section id="content-matches" class="space-y-4 hidden">
      <h2 class="text-lg font-bold text-slate-700 mb-2">Recent Matches</h2>
      <div id="matches-list" class="space-y-3">
        <p class="text-slate-400 text-center py-8">Loading match history...</p>
      </div>
    </section>

  </main>

  <!-- Auth Modal -->
  <div id="auth-modal" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-xl relative">
      <h3 id="auth-title" class="text-xl font-bold mb-4">Log In</h3>
      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
        <div id="name-field" class="hidden">
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Full Name</label>
          <input type="text" id="auth-name" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="John Doe">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Email</label>
          <input type="email" id="auth-email" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="name@example.com">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Password</label>
          <input type="password" id="auth-password" required class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="••••••••">
        </div>
        <div id="phone-field" class="hidden">
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Phone Number</label>
          <input type="tel" id="auth-phone" class="w-full border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="+1234567890">
        </div>

        <button type="submit" id="auth-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow transition">
          Log In
        </button>
      </form>

      <div class="mt-4 text-center text-sm text-slate-500">
        <span id="auth-switch-text">Don't have an account?</span>
        <button onclick="toggleAuthMode()" id="auth-switch-btn" class="text-indigo-600 font-semibold underline ml-1">Sign Up</button>
      </div>
      <button onclick="closeAuthModal()" class="mt-3 w-full text-slate-400 text-sm hover:text-slate-600">Cancel</button>
    </div>
  </div>

  <!-- Record/Edit Match Modal -->
  <div id="match-modal" class="fixed inset-0 bg-slate-900/60 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-xl relative max-h-[90vh] overflow-y-auto">
      <h3 id="match-modal-title" class="text-xl font-bold mb-4">Record Match Result</h3>
      <form id="match-form" onsubmit="handleRecordMatch(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Opponent</label>
          <select id="match-opponent" required class="w-full border border-slate-300 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="">Select opponent...</option>
          </select>
        </div>

        <div class="space-y-2 border-t border-b border-slate-100 py-3">
          <label class="block text-xs font-semibold text-slate-500 uppercase">Score (You vs Opponent)</label>
          
          <div class="flex items-center gap-2">
            <span class="text-sm font-medium w-16">Set 1:</span>
            <input type="number" id="set1-you" min="0" max="7" placeholder="You" required class="w-full border border-slate-300 rounded-lg p-2 text-center">
            <span>:</span>
            <input type="number" id="set1-opp" min="0" max="7" placeholder="Opponent" required class="w-full border border-slate-300 rounded-lg p-2 text-center">
          </div>

          <div class="flex items-center gap-2">
            <span class="text-sm font-medium w-16">Set 2:</span>
            <input type="number" id="set2-you" min="0" max="7" placeholder="You" class="w-full border border-slate-300 rounded-lg p-2 text-center">
            <span>:</span>
            <input type="number" id="set2-opp" min="0" max="7" placeholder="Opponent" class="w-full border border-slate-300 rounded-lg p-2 text-center">
          </div>

          <div class="flex items-center gap-2">
            <span class="text-sm font-medium w-16">Set 3:</span>
            <input type="number" id="set3-you" min="0" max="10" placeholder="You" class="w-full border border-slate-300 rounded-lg p-2 text-center">
            <span>:</span>
            <input type="number" id="set3-opp" min="0" max="10" placeholder="Opponent" class="w-full border border-slate-300 rounded-lg p-2 text-center">
          </div>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow transition">
          Save Match Result
        </button>
      </form>
      <button onclick="closeMatchModal()" class="mt-3 w-full text-slate-400 text-sm hover:text-slate-600">Cancel</button>
    </div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSy...",
      authDomain: "lk-tennis-club.firebaseapp.com",
      projectId: "lk-tennis-club",
      storageBucket: "lk-tennis-club.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let isSignUpMode = false;
    let editingMatchId = null;
    let allUsersMap = {};

    // English Auth Error Messages
    function getEnglishAuthErrorMessage(errorCode) {
      switch (errorCode) {
        case 'auth/email-already-in-use':
          return 'This email address is already registered. Please log in instead.';
        case 'auth/invalid-email':
          return 'Please enter a valid email address.';
        case 'auth/user-not-found':
        case 'auth/wrong-password':
        case 'auth/invalid-credential':
          return 'Incorrect email or password. Please try again.';
        case 'auth/weak-password':
          return 'Password should be at least 6 characters long.';
        default:
          return 'An error occurred during authentication. Please try again.';
      }
    }

    // Tab Switching
    function switchTab(tabName) {
      ['players', 'ready', 'matches'].forEach(tab => {
        document.getElementById(`content-${tab}`).classList.add('hidden');
        document.getElementById(`tab-${tab}`).className = 'py-3 px-4 text-center font-medium border-b-2 border-transparent text-slate-500 hover:text-indigo-600 w-1/3';
      });

      document.getElementById(`content-${tabName}`).classList.remove('hidden');
      document.getElementById(`tab-${tabName}`).className = 'py-3 px-4 text-center font-medium border-b-2 border-indigo-600 text-indigo-600 w-1/3';
    }

    // Modal Controls
    function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
    function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }
    
    function openMatchModal() {
      editingMatchId = null;
      document.getElementById('match-form').reset();
      document.getElementById('match-modal-title').innerText = 'Record Match Result';
      document.getElementById('match-modal').classList.remove('hidden');
    }

    function openEditMatchModal(matchId, opponentId, currentScore) {
      editingMatchId = matchId;
      document.getElementById('match-modal-title').innerText = 'Edit Match Result';
      document.getElementById('match-form').reset();
      
      document.getElementById('match-opponent').value = opponentId;

      const sets = currentScore.split(', ');
      if (sets[0]) {
        const s1 = sets[0].split(':');
        document.getElementById('set1-you').value = s1[0] || '';
        document.getElementById('set1-opp').value = s1[1] || '';
      }
      if (sets[1]) {
        const s2 = sets[1].split(':');
        document.getElementById('set2-you').value = s2[0] || '';
        document.getElementById('set2-opp').value = s2[1] || '';
      }
      if (sets[2]) {
        const s3 = sets[2].split(':');
        document.getElementById('set3-you').value = s3[0] || '';
        document.getElementById('set3-opp').value = s3[1] || '';
      }

      document.getElementById('match-modal').classList.remove('hidden');
    }

    function closeMatchModal() { 
      document.getElementById('match-modal').classList.add('hidden'); 
    }

    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      document.getElementById('auth-title').innerText = isSignUpMode ? 'Sign Up' : 'Log In';
      document.getElementById('auth-submit-btn').innerText = isSignUpMode ? 'Register' : 'Log In';
      document.getElementById('auth-switch-text').innerText = isSignUpMode ? 'Already have an account?' : "Don't have an account?";
      document.getElementById('auth-switch-btn').innerText = isSignUpMode ? 'Log In' : 'Sign Up';
      
      document.getElementById('name-field').classList.toggle('hidden', !isSignUpMode);
      document.getElementById('phone-field').classList.toggle('hidden', !isSignUpMode);
    }

    // Handle Authentication
    async function handleAuth(event) {
      event.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      try {
        if (isSignUpMode) {
          const name = document.getElementById('auth-name').value;
          const phone = document.getElementById('auth-phone').value;
          const userCred = await auth.createUserWithEmailAndPassword(email, password);
          
          await db.collection('users').doc(userCred.user.uid).set({
            name: name,
            email: email,
            phone: phone,
            elo: 1200,
            isReady: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
        closeAuthModal();
      } catch (error) {
        alert(getEnglishAuthErrorMessage(error.code));
      }
    }

    // Save or Edit Match
    async function handleRecordMatch(event) {
      event.preventDefault();
      if (!currentUser) return;

      const opponentId = document.getElementById('match-opponent').value;
      const s1Y = document.getElementById('set1-you').value;
      const s1O = document.getElementById('set1-opp').value;
      const s2Y = document.getElementById('set2-you').value;
      const s2O = document.getElementById('set2-opp').value;
      const s3Y = document.getElementById('set3-you').value;
      const s3O = document.getElementById('set3-opp').value;

      let scoreArray = [`${s1Y}:${s1O}`];
      if (s2Y && s2O) scoreArray.push(`${s2Y}:${s2O}`);
      if (s3Y && s3O) scoreArray.push(`${s3Y}:${s3O}`);
      const scoreString = scoreArray.join(', ');

      try {
        if (editingMatchId) {
          await db.collection('matches').doc(editingMatchId).update({
            score: scoreString,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          alert('Match result updated successfully!');
        } else {
          await db.collection('matches').add({
            player1Id: currentUser.uid,
            player2Id: opponentId,
            score: scoreString,
            date: firebase.firestore.FieldValue.serverTimestamp()
          });
          alert('Match recorded successfully!');
        }
        closeMatchModal();
      } catch (error) {
        alert('Error saving match: ' + error.message);
      }
    }

    // Fetch and Render Data
    function loadData() {
      // Load Users
      db.collection('users').orderBy('elo', 'desc').onSnapshot(snapshot => {
        const playersList = document.getElementById('players-list');
        const opponentSelect = document.getElementById('match-opponent');
        const readyList = document.getElementById('ready-players-list');
        
        let playersHtml = '';
        let optionsHtml = '<option value="">Select opponent...</option>';
        let readyHtml = '';

        allUsersMap = {};

        snapshot.docs.forEach((doc, index) => {
          const u = doc.data();
          u.id = doc.id;
          allUsersMap[doc.id] = u.name;

          playersHtml += `
            <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
              <div class="flex items-center gap-3">
                <span class="font-bold text-slate-400 w-6">#${index + 1}</span>
                <div>
                  <div class="font-bold text-slate-800">${u.name}</div>
                  <div class="text-xs text-slate-400">${u.phone || 'No phone'}</div>
                </div>
              </div>
              <div class="font-black text-indigo-600 bg-indigo-50 px-3 py-1 rounded-lg">${u.elo || 1200} Elo</div>
            </div>
          `;

          if (currentUser && doc.id !== currentUser.uid) {
            optionsHtml += `<option value="${doc.id}">${u.name}</option>`;
          }

          if (u.isReady) {
            readyHtml += `
              <div class="bg-emerald-50 border border-emerald-200 p-3 rounded-xl flex justify-between items-center">
                <div>
                  <div class="font-bold text-emerald-900">${u.name}</div>
                  <div class="text-xs text-emerald-700">Ready to play</div>
                </div>
                <a href="tel:${u.phone}" class="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-semibold">Call Player</a>
              </div>
            `;
          }
        });

        playersList.innerHTML = playersHtml || '<p class="text-slate-400 text-center py-8">No players yet.</p>';
        opponentSelect.innerHTML = optionsHtml;
        readyList.innerHTML = readyHtml || '<p class="text-slate-400 text-center py-8">No players currently ready on court.</p>';
      });

      // Load Matches
      db.collection('matches').orderBy('date', 'desc').onSnapshot(snapshot => {
        const matchesList = document.getElementById('matches-list');
        if (snapshot.empty) {
          matchesList.innerHTML = '<p class="text-slate-400 text-center py-8">No matches recorded yet.</p>';
          return;
        }

        matchesList.innerHTML = snapshot.docs.map(doc => {
          const m = doc.data();
          const matchId = doc.id;
          const p1Name = allUsersMap[m.player1Id] || 'Player 1';
          const p2Name = allUsersMap[m.player2Id] || 'Player 2';
          const isParticipant = currentUser && (m.player1Id === currentUser.uid || m.player2Id === currentUser.uid);

          return `
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
              <div>
                <div class="font-bold text-slate-800">${p1Name} vs ${p2Name}</div>
                <div class="text-sm text-indigo-600 font-semibold mt-1">Score: ${m.score}</div>
              </div>
              ${isParticipant ? `
                <button onclick="openEditMatchModal('${matchId}', '${m.player2Id}', '${m.score}')" 
                        class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-lg border border-slate-300 transition">
                  Edit
                </button>
              ` : ''}
            </div>
          `;
        }).join('');
      });
    }

    // Auth Listener
    auth.onAuthStateChanged(user => {
      currentUser = user;
      const headerContainer = document.getElementById('user-header');
      const addMatchBtn = document.getElementById('add-match-btn');

      if (user) {
        headerContainer.innerHTML = `
          <button onclick="auth.signOut()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-lg transition">
            Log Out
          </button>
        `;
        if (addMatchBtn) addMatchBtn.classList.remove('hidden');
      } else {
        headerContainer.innerHTML = `
          <button onclick="openAuthModal()" class="text-xs bg-white text-indigo-600 font-semibold px-3 py-1.5 rounded-lg shadow hover:bg-indigo-50 transition">
            Log In / Register
          </button>
        `;
        if (addMatchBtn) addMatchBtn.classList.add('hidden');
      }
      loadData();
    });
  </script>
</body>
</html>
