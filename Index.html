<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tennis Club — Ranking & Matches</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <link rel="icon" type="image/png" href="IMG_20260917_160556.png">
  <link rel="apple-touch-icon" href="IMG_20260917_160556.png">

</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span>🎾</span> Tennis Club
      </h1>
      <div id="user-nav" class="flex items-center gap-3">
        <!-- Filled via JS -->
      </div>
    </div>
  </header>

  <!-- Tab Navigation -->
  <nav class="bg-white border-b border-slate-200 sticky top-[60px] z-10">
    <div class="max-w-4xl mx-auto flex justify-around">
      <button onclick="switchTab('tab-players')" id="btn-tab-players" class="py-3 px-4 text-indigo-600 border-b-2 border-indigo-600 font-medium text-sm flex-1 text-center">Players</button>
      <button onclick="switchTab('tab-ready')" id="btn-tab-ready" class="py-3 px-4 text-slate-500 border-b-2 border-transparent font-medium text-sm flex-1 text-center">Ready to Play</button>
      <button onclick="switchTab('tab-matches')" id="btn-tab-matches" class="py-3 px-4 text-slate-500 border-b-2 border-transparent font-medium text-sm flex-1 text-center">Matches</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto p-4 flex-1 w-full">

    <!-- Tab: All Players / Leaderboard -->
    <section id="tab-players" class="space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-700">Player Leaderboard (Elo)</h2>
        <span class="text-xs text-slate-500">Every set counts</span>
      </div>
      <div id="players-list" class="space-y-2">
        <!-- Player List -->
      </div>
    </section>

    <!-- Tab: Ready to Play -->
    <section id="tab-ready" class="space-y-4 hidden">
      <div class="bg-emerald-50 border border-emerald-200 rounded-lg p-4 flex justify-between items-center">
        <div>
          <h3 class="font-semibold text-emerald-900">Your Status</h3>
          <p class="text-xs text-emerald-700">Let others know you are ready on court</p>
        </div>
        <button id="toggle-ready-btn" onclick="toggleReadyStatus()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
          I'm ready to play!
        </button>
      </div>

      <h2 class="text-lg font-bold text-slate-700 pt-2">Currently Ready to Play</h2>
      <div id="ready-players-list" class="space-y-2">
        <!-- Ready Players List -->
      </div>
    </section>

    <!-- Tab: Matches -->
    <section id="tab-matches" class="space-y-4 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-700">Match History</h2>
        <button onclick="openMatchModal()" id="add-match-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-3 py-1.5 rounded-lg font-medium hidden">
          + Record Match
        </button>
      </div>
      <div id="matches-list" class="space-y-3">
        <!-- Matches List -->
      </div>
    </section>

  </main>

  <!-- Modal: Auth / Registration -->
  <div id="auth-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-6 max-w-sm w-full space-y-4 shadow-xl">
      <h3 id="auth-title" class="text-xl font-bold text-slate-800">Log In</h3>
      
      <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-3">
        <div id="name-group" class="hidden">
          <label class="block text-xs font-medium text-slate-600 mb-1">Full Name</label>
          <input type="text" id="auth-name" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Email</label>
          <input type="email" id="auth-email" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Password</label>
          <input type="password" id="auth-password" required class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div id="phone-group" class="hidden">
          <label class="block text-xs font-medium text-slate-600 mb-1">Phone Number</label>
          <input type="tel" id="auth-phone" placeholder="+1..." class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <button type="submit" id="auth-submit-btn" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition mt-2">
          Log In
        </button>
      </form>

      <div class="text-center text-xs text-slate-500 pt-2 border-t">
        <span id="auth-toggle-text">Don't have an account?</span>
        <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-indigo-600 font-semibold underline ml-1">Sign Up</button>
      </div>
      <button onclick="closeAuthModal()" class="w-full text-center text-xs text-slate-400 mt-2">Cancel</button>
    </div>
  </div>

  <!-- Modal: Record Match Result -->
  <div id="match-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-6 max-w-md w-full space-y-4 shadow-xl">
      <h3 class="text-xl font-bold text-slate-800">Record Match Result</h3>
      
      <form id="match-form" onsubmit="saveMatch(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Opponent</label>
          <select id="match-opponent" required class="w-full border rounded-lg p-2 text-sm outline-none">
            <!-- Opponent select list -->
          </select>
        </div>

        <div class="space-y-2 pt-2">
          <label class="block text-xs font-medium text-slate-600">Score by sets (You vs Opponent):</label>
          <div class="grid grid-cols-3 gap-2">
            <div>
              <span class="text-xs text-slate-400 block text-center">Set 1</span>
              <div class="flex gap-1">
                <input type="number" id="s1-p1" min="0" max="7" placeholder="6" required class="w-full border text-center rounded p-1 text-sm">
                <input type="number" id="s1-p2" min="0" max="7" placeholder="4" required class="w-full border text-center rounded p-1 text-sm">
              </div>
            </div>
            <div>
              <span class="text-xs text-slate-400 block text-center">Set 2</span>
              <div class="flex gap-1">
                <input type="number" id="s2-p1" min="0" max="7" placeholder="3" required class="w-full border text-center rounded p-1 text-sm">
                <input type="number" id="s2-p2" min="0" max="7" placeholder="6" required class="w-full border text-center rounded p-1 text-sm">
              </div>
            </div>
            <div>
              <span class="text-xs text-slate-400 block text-center">Set 3 (optional)</span>
              <div class="flex gap-1">
                <input type="number" id="s3-p1" min="0" max="15" placeholder="10" class="w-full border text-center rounded p-1 text-sm">
                <input type="number" id="s3-p2" min="0" max="15" placeholder="8" class="w-full border text-center rounded p-1 text-sm">
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-medium hover:bg-emerald-700 transition mt-4">
          Save & Recalculate Elo
        </button>
      </form>
      <button onclick="closeMatchModal()" class="w-full text-center text-xs text-slate-400">Cancel</button>
    </div>
  </div>

  <script>
    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyC93VsSVGfh14n2u3JShZ53-JJCqTiDvOs",
      authDomain: "lk-tennis.firebaseapp.com",
      projectId: "lk-tennis",
      storageBucket: "lk-tennis.appspot.com",
      messagingSenderId: "1028741300977",
      appId: "1:1028741300977:web:96e8d254b1f69cbba62bbf"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let currentUserData = null;
    let isRegisterMode = false;
    let allUsers = [];

    // Auth state tracking
    auth.onAuthStateChanged(async (user) => {
      currentUser = user;
      if (user) {
        const doc = await db.collection('users').doc(user.uid).get();
        currentUserData = doc.data();
        renderNavLoggedIn();
        document.getElementById('add-match-btn').classList.remove('hidden');
      } else {
        currentUserData = null;
        renderNavLoggedOut();
        document.getElementById('add-match-btn').classList.add('hidden');
      }
      updateReadyButtonUI();
      loadPlayers();
      loadMatches();
    });

    // Tab switching
    function switchTab(tabId) {
      ['tab-players', 'tab-ready', 'tab-matches'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
        document.getElementById('btn-' + id).classList.remove('border-indigo-600', 'text-indigo-600');
        document.getElementById('btn-' + id).classList.add('border-transparent', 'text-slate-500');
      });
      document.getElementById(tabId).classList.remove('hidden');
      document.getElementById('btn-' + tabId).classList.add('border-indigo-600', 'text-indigo-600');
      document.getElementById('btn-' + tabId).classList.remove('border-transparent', 'text-slate-500');
    }

    // Render Nav
    function renderNavLoggedIn() {
      document.getElementById('user-nav').innerHTML = `
        <span class="text-xs font-medium bg-indigo-700 px-2 py-1 rounded-md">${currentUserData?.name || 'Player'} (${currentUserData?.rating || 1500})</span>
        <button onclick="auth.signOut()" class="text-xs bg-indigo-800 hover:bg-indigo-900 px-2 py-1 rounded-md">Log Out</button>
      `;
    }

    function renderNavLoggedOut() {
      document.getElementById('user-nav').innerHTML = `
        <button onclick="openAuthModal()" class="text-xs bg-white text-indigo-600 font-semibold px-3 py-1.5 rounded-md shadow hover:bg-slate-50">Log In</button>
      `;
    }

    function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); document.getElementById('auth-modal').classList.add('flex'); }
    function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); document.getElementById('auth-modal').classList.remove('flex'); }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').innerText = isRegisterMode ? 'Sign Up' : 'Log In';
      document.getElementById('auth-submit-btn').innerText = isRegisterMode ? 'Sign Up' : 'Log In';
      document.getElementById('name-group').classList.toggle('hidden', !isRegisterMode);
      document.getElementById('phone-group').classList.toggle('hidden', !isRegisterMode);
      document.getElementById('auth-toggle-text').innerText = isRegisterMode ? 'Already have an account?' : "Don't have an account?";
      document.getElementById('auth-toggle-btn').innerText = isRegisterMode ? 'Log In' : 'Sign Up';
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      try {
        if (isRegisterMode) {
          const name = document.getElementById('auth-name').value;
          const phone = document.getElementById('auth-phone').value;
          const res = await auth.createUserWithEmailAndPassword(email, password);
          await db.collection('users').doc(res.user.uid).set({
            name: name,
            phone: phone,
            email: email,
            rating: 1500,
            isReady: false,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
        closeAuthModal();
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    // Load players
    function loadPlayers() {
      db.collection('users').orderBy('rating', 'desc').onSnapshot(snapshot => {
        allUsers = [];
        const playersList = document.getElementById('players-list');
        const readyList = document.getElementById('ready-players-list');
        const selectOpponent = document.getElementById('match-opponent');

        playersList.innerHTML = '';
        readyList.innerHTML = '';
        selectOpponent.innerHTML = '<option value="">Select opponent...</option>';

        let rank = 1;
        snapshot.forEach(doc => {
          const u = { id: doc.id, ...doc.data() };
          allUsers.push(u);

          // All players list (Leaderboard)
          playersList.innerHTML += `
            <div class="bg-white p-3 rounded-lg border border-slate-200 flex justify-between items-center shadow-sm">
              <div class="flex items-center gap-3">
                <span class="font-bold text-slate-400 w-5 text-center">${rank++}</span>
                <div>
                  <div class="font-semibold text-slate-800 flex items-center gap-1.5">
                    ${u.name}
                    ${u.isReady ? '<span class="w-2 h-2 rounded-full bg-emerald-500" title="Ready to play"></span>' : ''}
                  </div>
                  <div class="text-xs text-slate-500">${u.phone || u.email}</div>
                </div>
              </div>
              <div class="text-right">
                <span class="font-bold text-indigo-600 text-lg">${u.rating || 1500}</span>
                <span class="text-[10px] text-slate-400 block">Elo</span>
              </div>
            </div>
          `;

          // Ready to Play list
          if (u.isReady) {
            readyList.innerHTML += `
              <div class="bg-white p-3 rounded-lg border border-emerald-200 flex justify-between items-center shadow-sm">
                <div>
                  <div class="font-semibold text-slate-800">${u.name}</div>
                  <div class="text-xs text-slate-500">Phone: ${u.phone || 'Not specified'}</div>
                </div>
                <a href="tel:${u.phone}" class="bg-emerald-100 text-emerald-800 text-xs px-3 py-1.5 rounded-lg font-medium hover:bg-emerald-200">Call</a>
              </div>
            `;
          }

          // Opponent select
          if (currentUser && u.id !== currentUser.uid) {
            selectOpponent.innerHTML += `<option value="${u.id}">${u.name} (${u.rating || 1500})</option>`;
          }
        });

        if (readyList.innerHTML === '') {
          readyList.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">No one on court. Click the button above to be first!</p>';
        }
      });
    }

    // Toggle Ready status
    async function toggleReadyStatus() {
      if (!currentUser) return openAuthModal();
      const newStatus = !currentUserData?.isReady;
      await db.collection('users').doc(currentUser.uid).update({ isReady: newStatus });
      currentUserData.isReady = newStatus;
      updateReadyButtonUI();
    }

    function updateReadyButtonUI() {
      const btn = document.getElementById('toggle-ready-btn');
      if (currentUserData?.isReady) {
        btn.innerText = "I'm done / Busy";
        btn.className = 'bg-slate-500 hover:bg-slate-600 text-white text-sm font-medium px-4 py-2 rounded-lg transition';
      } else {
        btn.innerText = "I'm ready to play!";
        btn.className = 'bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition';
      }
    }

    // Match modal
    function openMatchModal() { document.getElementById('match-modal').classList.remove('hidden'); document.getElementById('match-modal').classList.add('flex'); }
    function closeMatchModal() { document.getElementById('match-modal').classList.add('hidden'); document.getElementById('match-modal').classList.remove('flex'); }

    // Elo calculation
    function calculateSetElo(ratingA, ratingB, setsA, setsB) {
      const K = 32;
      let totalChangeA = 0;
      let totalChangeB = 0;

      for (let i = 0; i < setsA.length; i++) {
        const scoreA = setsA[i];
        const scoreB = setsB[i];

        let actualA = 0.5;
        if (scoreA > scoreB) actualA = 1;
        else if (scoreB > scoreA) actualA = 0;

        const expectedA = 1 / (1 + Math.pow(10, (ratingB - ratingA) / 400));
        const change = K * (actualA - expectedA);

        totalChangeA += change;
        totalChangeB -= change;
      }

      return {
        newRatingA: Math.round(ratingA + totalChangeA),
        newRatingB: Math.round(ratingB + totalChangeB),
        diffA: Math.round(totalChangeA),
        diffB: Math.round(totalChangeB)
      };
    }

    async function saveMatch(e) {
      e.preventDefault();
      const oppId = document.getElementById('match-opponent').value;
      if (!oppId) return alert('Select an opponent');

      const opponent = allUsers.find(u => u.id === oppId);

      const s1A = parseInt(document.getElementById('s1-p1').value);
      const s1B = parseInt(document.getElementById('s1-p2').value);
      const s2A = parseInt(document.getElementById('s2-p1').value);
      const s2B = parseInt(document.getElementById('s2-p2').value);
      const s3A = document.getElementById('s3-p1').value ? parseInt(document.getElementById('s3-p1').value) : null;
      const s3B = document.getElementById('s3-p2').value ? parseInt(document.getElementById('s3-p2').value) : null;

      const setsA = [s1A, s2A];
      const setsB = [s1B, s2B];
      if (s3A !== null && s3B !== null) {
        setsA.push(s3A);
        setsB.push(s3B);
      }

      const scoreStr = `${s1A}:${s1B}, ${s2A}:${s2B}` + (s3A !== null ? `, ${s3A}:${s3B}` : '');
      const eloResult = calculateSetElo(currentUserData.rating || 1500, opponent.rating || 1500, setsA, setsB);

      await db.collection('matches').add({
        player1Id: currentUser.uid,
        player1Name: currentUserData.name,
        player2Id: opponent.id,
        player2Name: opponent.name,
        scoreStr: scoreStr,
        diffP1: eloResult.diffA,
        diffP2: eloResult.diffB,
        date: firebase.firestore.FieldValue.serverTimestamp()
      });

      await db.collection('users').doc(currentUser.uid).update({ rating: eloResult.newRatingA });
      await db.collection('users').doc(opponent.id).update({ rating: eloResult.newRatingB });

      closeMatchModal();
      document.getElementById('match-form').reset();
    }

    function loadMatches() {
      db.collection('matches').orderBy('date', 'desc').limit(20).onSnapshot(snapshot => {
        const matchesList = document.getElementById('matches-list');
        matchesList.innerHTML = '';

        if (snapshot.empty) {
          matchesList.innerHTML = '<p class="text-sm text-slate-400 text-center py-4">No matches recorded yet.</p>';
          return;
        }

        snapshot.forEach(doc => {
          const m = doc.data();
          const p1Diff = m.diffP1 >= 0 ? `+${m.diffP1}` : m.diffP1;
          const p2Diff = m.diffP2 >= 0 ? `+${m.diffP2}` : m.diffP2;

          matchesList.innerHTML += `
            <div class="bg-white p-3 rounded-lg border border-slate-200 shadow-sm">
              <div class="flex justify-between items-center text-sm font-semibold text-slate-800 mb-1">
                <div>
                  ${m.player1Name} <span class="text-xs ${m.diffP1 >= 0 ? 'text-emerald-600' : 'text-red-500'}">(${p1Diff})</span>
                </div>
                <span class="text-xs text-slate-400">vs</span>
                <div>
                  ${m.player2Name} <span class="text-xs ${m.diffP2 >= 0 ? 'text-emerald-600' : 'text-red-500'}">(${p2Diff})</span>
                </div>
              </div>
              <div class="text-center font-mono font-bold text-indigo-600 text-sm bg-slate-50 py-1 rounded">
                ${m.scoreStr}
              </div>
            </div>
          `;
        });
      });
    }
  </script>
</body>
</html>
