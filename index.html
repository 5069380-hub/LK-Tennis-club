<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tennis Club Ranking & Matches</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen text-gray-800">

  <!-- Header -->
  <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-wide">Tennis Club</h1>
    <div id="authContainer">
      <button id="loginBtn" onclick="toggleAuthModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm px-3 py-1.5 rounded-lg transition">
        Sign In
      </button>
      <div id="userInfo" class="hidden flex items-center space-x-2">
        <span id="userEmail" class="text-xs text-indigo-200"></span>
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white text-xs px-2.5 py-1 rounded transition">Logout</button>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="flex border-b bg-white shadow-sm">
    <button onclick="switchTab('rankings')" id="tabRankings" class="flex-1 py-3 text-center font-medium text-indigo-600 border-b-2 border-indigo-600">Rankings</button>
    <button onclick="switchTab('matches')" id="tabMatches" class="flex-1 py-3 text-center font-medium text-gray-500">Matches</button>
  </nav>

  <main class="max-w-xl mx-auto p-4 space-y-6">

    <!-- Rankings Tab -->
    <section id="rankingsSection">
      <h2 class="text-lg font-semibold mb-3 flex items-center justify-between">
        <span>Player Standings</span>
      </h2>
      <div id="playersList" class="space-y-2">
        <!-- Players loaded dynamically -->
      </div>
    </section>

    <!-- Matches Tab -->
    <section id="matchesSection" class="hidden space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-semibold">Recent Matches</h2>
        <button onclick="openAddMatchModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-3 py-1.5 rounded-lg font-medium transition">
          + Add Match
        </button>
      </div>
      <div id="matchesList" class="space-y-2">
        <!-- Matches loaded dynamically -->
      </div>
    </section>

  </main>

  <!-- Player Profile Modal -->
  <div id="profileModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeProfileModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      
      <div class="text-center mb-6">
        <img id="profPhoto" src="https://via.placeholder.com/100?text=Tennis" alt="Player Photo" class="w-24 h-24 rounded-full mx-auto object-cover border-4 border-indigo-100 shadow-md mb-3">
        <h3 id="profName" class="text-2xl font-bold text-gray-900"></h3>
        <p id="profPhone" class="text-xs text-gray-500 mt-0.5"></p>
        <div class="inline-block bg-indigo-50 px-3 py-1 rounded-full text-indigo-700 font-bold text-sm mt-2">
          Elo Rating: <span id="profElo"></span>
        </div>
      </div>

      <!-- Stats Summary -->
      <div class="grid grid-cols-3 gap-2 text-center mb-6">
        <div class="bg-gray-50 p-2.5 rounded-xl">
          <div id="profMatches" class="text-lg font-bold text-gray-800">0</div>
          <div class="text-[10px] uppercase font-semibold text-gray-400">Matches</div>
        </div>
        <div class="bg-emerald-50 p-2.5 rounded-xl">
          <div id="profWins" class="text-lg font-bold text-emerald-600">0</div>
          <div class="text-[10px] uppercase font-semibold text-emerald-600">Wins</div>
        </div>
        <div class="bg-rose-50 p-2.5 rounded-xl">
          <div id="profLosses" class="text-lg font-bold text-rose-600">0</div>
          <div class="text-[10px] uppercase font-semibold text-rose-600">Losses</div>
        </div>
      </div>

      <!-- Bio / Info Details -->
      <div class="bg-gray-50 rounded-xl p-4 mb-6 text-sm space-y-2">
        <h4 class="font-semibold text-gray-700 border-b pb-1 mb-2 text-xs uppercase tracking-wider">Player Info</h4>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div><span class="text-gray-400">NTRP Self-Rating:</span> <span id="profNtrp" class="font-medium">N/A</span></div>
          <div><span class="text-gray-400">Age:</span> <span id="profAge" class="font-medium">N/A</span></div>
          <div><span class="text-gray-400">Plays:</span> <span id="profHand" class="font-medium">N/A</span></div>
          <div><span class="text-gray-400">Backhand:</span> <span id="profBackhand" class="font-medium">N/A</span></div>
        </div>
        <div class="text-xs pt-1"><span class="text-gray-400">Racket:</span> <span id="profRacket" class="font-medium">N/A</span></div>
        <div class="text-xs"><span class="text-gray-400">Preferred Courts:</span> <span id="profLocations" class="font-medium">N/A</span></div>
        <div class="text-xs"><span class="text-gray-400">Preferred Time:</span> <span id="profTimes" class="font-medium">N/A</span></div>
      </div>

      <!-- Action: Edit Profile (visible only to profile owner) -->
      <button id="editProfileBtn" onclick="openEditProfileModal()" class="w-full mb-4 hidden bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl text-sm font-medium transition">
        Edit Profile
      </button>

      <!-- Match History -->
      <div>
        <h4 class="font-semibold text-gray-800 mb-2 text-sm">Match History</h4>
        <div id="profHistory" class="space-y-1.5 max-h-48 overflow-y-auto pr-1">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div id="editModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button onclick="closeEditModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      <h3 class="text-lg font-bold text-gray-900 mb-4">Edit Profile</h3>
      
      <form id="editProfileForm" onsubmit="saveProfile(event)" class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Photo URL</label>
          <input type="url" id="editPhotoURL" placeholder="https://example.com/photo.jpg" class="w-full border rounded-lg p-2 text-xs">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Age</label>
            <input type="number" id="editAge" placeholder="e.g. 32" class="w-full border rounded-lg p-2 text-xs">
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">NTRP Rating</label>
            <select id="editNtrp" class="w-full border rounded-lg p-2 text-xs">
              <option value="">Select NTRP</option>
              <option value="2.5">2.5 (Beginner)</option>
              <option value="3.0">3.0 (Intermediate)</option>
              <option value="3.5">3.5 (Intermediate+)</option>
              <option value="4.0">4.0 (Advanced)</option>
              <option value="4.5">4.5 (Advanced+)</option>
              <option value="5.0">5.0 (Expert)</option>
            </select>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Handedness</label>
            <select id="editHand" class="w-full border rounded-lg p-2 text-xs">
              <option value="">Select Hand</option>
              <option value="Right-handed">Right-handed</option>
              <option value="Left-handed">Left-handed</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Backhand</label>
            <select id="editBackhand" class="w-full border rounded-lg p-2 text-xs">
              <option value="">Select Backhand</option>
              <option value="Two-handed">Two-handed</option>
              <option value="One-handed">One-handed</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Racket & Setup</label>
          <input type="text" id="editRacket" placeholder="e.g. Wilson Blade 98" class="w-full border rounded-lg p-2 text-xs">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Preferred Locations / Courts</label>
          <input type="text" id="editLocations" placeholder="e.g. Central Park Courts, West Side" class="w-full border rounded-lg p-2 text-xs">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Preferred Play Time</label>
          <input type="text" id="editTimes" placeholder="e.g. Weekday evenings, Sunday morning" class="w-full border rounded-lg p-2 text-xs">
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-xl transition text-sm mt-4">
          Save Changes
        </button>
      </form>
    </div>
  </div>

  <!-- Sign In / Auth Modal -->
  <div id="authModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-xs w-full p-6 shadow-2xl relative">
      <button onclick="toggleAuthModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-lg font-bold">&times;</button>
      <h3 id="authTitle" class="text-base font-bold text-gray-900 mb-3 text-center">Sign In</h3>
      <form onsubmit="handleAuth(event)" class="space-y-3 text-xs">
        <input type="email" id="authEmail" placeholder="Email" required class="w-full border rounded-lg p-2">
        <input type="password" id="authPassword" placeholder="Password" required class="w-full border rounded-lg p-2">
        <button type="submit" id="authSubmitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-medium transition">
          Sign In
        </button>
      </form>
      <div class="text-center mt-3">
        <button onclick="toggleAuthMode()" id="toggleAuthBtn" class="text-[11px] text-indigo-600 hover:underline">
          Need an account? Sign Up
        </button>
      </div>
    </div>
  </div>

  <script>
    // Firebase Config (Replace with your own project config if needed)
    const firebaseConfig = {
      apiKey: "AIzaSyDummyKeyForTemplate",
      authDomain: "lk-tennis-club.firebaseapp.com",
      projectId: "lk-tennis-club",
      storageBucket: "lk-tennis-club.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abc123def456"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUserId = null;
    let currentProfilePlayerId = null;
    let isSignUpMode = false;

    // Track Auth State
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUserId = user.uid;
        document.getElementById('loginBtn').classList.add('hidden');
        document.getElementById('userInfo').classList.remove('hidden');
        document.getElementById('userEmail').textContent = user.email;
      } else {
        currentUserId = null;
        document.getElementById('loginBtn').classList.remove('hidden');
        document.getElementById('userInfo').classList.add('hidden');
      }
    });

    function toggleAuthModal() {
      document.getElementById('authModal').classList.toggle('hidden');
    }

    function toggleAuthMode() {
      isSignUpMode = !isSignUpMode;
      document.getElementById('authTitle').textContent = isSignUpMode ? 'Sign Up' : 'Sign In';
      document.getElementById('authSubmitBtn').textContent = isSignUpMode ? 'Sign Up' : 'Sign In';
      document.getElementById('toggleAuthBtn').textContent = isSignUpMode ? 'Already have an account? Sign In' : 'Need an account? Sign Up';
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('authEmail').value;
      const pass = document.getElementById('authPassword').value;
      try {
        if (isSignUpMode) {
          await auth.createUserWithEmailAndPassword(email, pass);
        } else {
          await auth.signInWithEmailAndPassword(email, pass);
        }
        toggleAuthModal();
      } catch (err) {
        alert(err.message);
      }
    }

    function logout() {
      auth.signOut();
    }

    // Modal Helpers
    function closeProfileModal() { document.getElementById('profileModal').classList.add('hidden'); }
    function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }
    function openEditProfileModal() { document.getElementById('editModal').classList.remove('hidden'); }

    // Save Edit Profile Form
    async function saveProfile(e) {
      e.preventDefault();
      if (!currentProfilePlayerId) return;

      const updatedData = {
        photoURL: document.getElementById('editPhotoURL').value || '',
        age: document.getElementById('editAge').value || '',
        selfRating: document.getElementById('editNtrp').value || '',
        hand: document.getElementById('editHand').value || '',
        backhand: document.getElementById('editBackhand').value || '',
        racket: document.getElementById('editRacket').value || '',
        locations: document.getElementById('editLocations').value || '',
        times: document.getElementById('editTimes').value || ''
      };

      try {
        await db.collection('players').doc(currentProfilePlayerId).update(updatedData);
        closeEditModal();
        alert('Profile updated successfully!');
      } catch (err) {
        console.error(err);
        alert('Failed to update profile.');
      }
    }

    function switchTab(tab) {
      const rankings = document.getElementById('rankingsSection');
      const matches = document.getElementById('matchesSection');
      const tabR = document.getElementById('tabRankings');
      const tabM = document.getElementById('tabMatches');

      if (tab === 'rankings') {
        rankings.classList.remove('hidden');
        matches.classList.add('hidden');
        tabR.className = "flex-1 py-3 text-center font-medium text-indigo-600 border-b-2 border-indigo-600";
        tabM.className = "flex-1 py-3 text-center font-medium text-gray-500";
      } else {
        rankings.classList.add('hidden');
        matches.classList.remove('hidden');
        tabM.className = "flex-1 py-3 text-center font-medium text-indigo-600 border-b-2 border-indigo-600";
        tabR.className = "flex-1 py-3 text-center font-medium text-gray-500";
      }
    }
  </script>
</body>
</html>
